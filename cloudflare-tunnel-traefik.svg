<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Luồng Cloudflare Tunnel vào Kubernetes qua Traefik</title>
  <desc id="desc">Browser phân giải DNS và kết nối Cloudflare Edge. Hai replica cloudflared chủ động mở kết nối outbound; Edge gửi mỗi request xuống một connector đang Healthy. Connector dùng CoreDNS tìm Service Traefik. Traefik nạp rule từ Ingress rồi chuyển request qua Service web tới một Pod web. Response quay lại theo đường ngược.</desc>
  <defs>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-tunnel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-config" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-dns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 600; }
      .zone-title { font-size: 18px; font-weight: 600; }
      .node-title { font-size: 16px; font-weight: 600; }
      .node-sub { font-size: 14px; }
      .edge-label { font-size: 13px; font-weight: 500; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .zone-public { fill: #f1f5ff; stroke: #7c93c3; stroke-width: 1.5; }
      .zone-lab { fill: #f5f7fa; stroke: #8290a3; stroke-width: 1.5; }
      .zone-k8s { fill: #ffffff; stroke: #a1acba; stroke-width: 1.5; }
      .node-external { fill: #e8eefc; stroke: #2b4c9b; stroke-width: 1.5; }
      .node-k8s { fill: #ffffff; stroke: #526070; stroke-width: 1.5; }
      .node-service { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
      .node-config { fill: #fdf3e0; stroke: #a8791f; stroke-width: 1.5; }
      .data { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow-data); }
      .request { fill: none; stroke: #334155; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-data); }
      .tunnel { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-tunnel); }
      .config { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#arrow-config); }
      .dns { fill: none; stroke: #0f766e; stroke-width: 2; marker-start: url(#arrow-dns); marker-end: url(#arrow-dns); }
      .response { fill: none; stroke: #15803d; stroke-width: 2.5; stroke-dasharray: 9 5; marker-end: url(#arrow-response); }
      .legend-text { font-size: 13px; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#ffffff"/>
  <text class="title" x="800" y="38" text-anchor="middle">Cloudflare Tunnel → Kubernetes → Traefik → ứng dụng</text>

  <rect class="zone-public" x="45" y="60" width="1510" height="250" rx="10"/>
  <text class="zone-title" x="70" y="90">Internet và Cloudflare</text>

  <rect class="node-external" x="85" y="145" width="255" height="78" rx="8"/>
  <text class="node-title" x="212" y="177" text-anchor="middle">Browser</text>
  <text class="node-sub" x="212" y="202" text-anchor="middle">https://app.hieupn.site</text>

  <rect class="node-external" x="400" y="92" width="310" height="88" rx="8"/>
  <text class="node-title" x="555" y="124" text-anchor="middle">Cloudflare public DNS</text>
  <text class="node-sub" x="555" y="148" text-anchor="middle">app.hieupn.site</text>
  <text class="node-sub" x="555" y="168" text-anchor="middle">→ Edge Anycast IP</text>

  <rect class="node-external" x="805" y="135" width="285" height="95" rx="8"/>
  <text class="node-title" x="947" y="168" text-anchor="middle">Cloudflare Edge</text>
  <text class="node-sub" x="947" y="193" text-anchor="middle">TLS · WAF · Tunnel routing</text>
  <text class="node-sub" x="947" y="214" text-anchor="middle">HTTPS :443</text>

  <rect class="node-config" x="1170" y="83" width="335" height="122" rx="8"/>
  <text class="node-title" x="1337" y="113" text-anchor="middle">Published application route</text>
  <text class="node-sub" x="1337" y="139" text-anchor="middle">app.hieupn.site → homelab-k8s</text>
  <text class="node-sub" x="1337" y="164" text-anchor="middle">origin:</text>
  <text class="node-sub" x="1337" y="186" text-anchor="middle">http://traefik.traefik.svc.cluster.local:80</text>

  <path class="data" d="M340 164 C365 145 375 133 400 128"/>
  <text class="edge-label" x="365" y="119" text-anchor="middle">1. DNS query</text>
  <path class="data" d="M340 194 C525 235 640 235 805 194"/>
  <text class="edge-label" x="575" y="246" text-anchor="middle">2. HTTPS :443 tới Edge IP</text>
  <path class="config" d="M1170 145 C1135 145 1120 160 1090 172"/>
  <text class="edge-label" x="1138" y="127" text-anchor="middle">control plane</text>

  <rect class="zone-lab" x="45" y="340" width="1510" height="660" rx="10"/>
  <text class="zone-title" x="70" y="372">Mạng lab sau router/NAT — không mở inbound</text>
  <rect class="zone-k8s" x="75" y="390" width="1450" height="580" rx="9"/>
  <text class="zone-title" x="100" y="423">Kubernetes cluster</text>

  <rect class="node-k8s" x="135" y="470" width="285" height="88" rx="8"/>
  <text class="node-title" x="277" y="502" text-anchor="middle">cloudflared connector replica 1</text>
  <text class="node-sub" x="277" y="529" text-anchor="middle">Active / Healthy</text>

  <rect class="node-k8s" x="465" y="470" width="285" height="88" rx="8"/>
  <text class="node-title" x="607" y="502" text-anchor="middle">cloudflared connector replica 2</text>
  <text class="node-sub" x="607" y="529" text-anchor="middle">Active / Healthy</text>

  <path class="tunnel" d="M300 470 C390 360 660 285 870 230"/>
  <text class="edge-label" x="530" y="340" text-anchor="middle">A. outbound mã hóa · QUIC/UDP hoặc HTTP2/TCP :7844</text>
  <path class="tunnel" d="M620 470 C680 350 790 280 925 230"/>

  <path class="request" d="M875 230 C700 310 510 385 385 470"/>
  <text class="edge-label" x="645" y="384" text-anchor="middle">3. request xuống một connector Healthy qua connection đã mở</text>
  <path class="request" d="M970 230 C875 320 760 385 675 470"/>
  <text class="edge-label" x="825" y="430" text-anchor="middle">hoặc connector này</text>

  <rect class="node-k8s" x="135" y="650" width="240" height="78" rx="8"/>
  <text class="node-title" x="255" y="696" text-anchor="middle">CoreDNS</text>

  <path class="dns" d="M250 558 C225 585 225 620 245 650"/>
  <text class="edge-label" x="146" y="610">4. query / ClusterIP</text>
  <path class="dns" d="M585 558 C505 610 410 655 375 674"/>

  <rect class="node-service" x="520" y="650" width="245" height="82" rx="8"/>
  <text class="node-title" x="642" y="682" text-anchor="middle">Service traefik</text>
  <text class="node-sub" x="642" y="707" text-anchor="middle">ClusterIP :80</text>

  <path class="data" d="M340 558 C420 592 500 620 585 650"/>
  <text class="edge-label" x="430" y="629" text-anchor="middle">5. HTTP :80 nếu replica 1 được chọn</text>
  <path class="data" d="M610 558 C615 590 625 620 635 650"/>
  <text class="edge-label" x="707" y="607" text-anchor="middle">hoặc replica 2</text>

  <rect class="node-k8s" x="850" y="650" width="220" height="82" rx="8"/>
  <text class="node-title" x="960" y="697" text-anchor="middle">Traefik Pod</text>
  <path class="data" d="M765 691 L850 691"/>
  <text class="edge-label" x="807" y="678" text-anchor="middle">6. endpoint</text>

  <rect class="node-config" x="825" y="470" width="300" height="90" rx="8"/>
  <text class="node-title" x="975" y="500" text-anchor="middle">Ingress web — object cấu hình</text>
  <text class="node-sub" x="975" y="526" text-anchor="middle">Host: app.hieupn.site</text>
  <text class="node-sub" x="975" y="547" text-anchor="middle">không nằm trên data path</text>
  <path class="config" d="M975 560 L965 650"/>
  <text class="edge-label" x="1055" y="610" text-anchor="middle">Traefik watch và nạp rule</text>

  <rect class="node-service" x="1190" y="650" width="230" height="82" rx="8"/>
  <text class="node-title" x="1305" y="682" text-anchor="middle">Service web :80</text>
  <text class="node-sub" x="1305" y="707" text-anchor="middle">selector app=web</text>
  <path class="data" d="M1070 691 L1190 691"/>
  <text class="edge-label" x="1130" y="678" text-anchor="middle">7. Host khớp rule</text>

  <rect class="node-k8s" x="1065" y="820" width="215" height="78" rx="8"/>
  <text class="node-title" x="1172" y="852" text-anchor="middle">Pod web replica 1</text>
  <text class="node-sub" x="1172" y="878" text-anchor="middle">backend</text>
  <rect class="node-k8s" x="1320" y="820" width="215" height="78" rx="8"/>
  <text class="node-title" x="1427" y="852" text-anchor="middle">Pod web replica 2</text>
  <text class="node-sub" x="1427" y="878" text-anchor="middle">backend</text>
  <path class="data" d="M1275 732 C1245 765 1215 790 1185 820"/>
  <path class="data" d="M1335 732 C1370 765 1395 790 1415 820"/>
  <text class="edge-label" x="1305" y="786" text-anchor="middle">8. Service chọn một backend</text>

  <path class="response" d="M1427 898 L1500 898 L1500 292 L350 292 L350 223 L265 223"/>
  <text class="edge-label" x="1240" y="282" text-anchor="middle">9. response quay ngược: Pod → Traefik → cloudflared → Tunnel → Edge → Browser</text>

  <g transform="translate(95 935)">
    <line x1="0" y1="0" x2="55" y2="0" class="tunnel"/>
    <text class="legend-text" x="68" y="5">connector chủ động mở tunnel outbound</text>
    <line x1="355" y1="0" x2="410" y2="0" class="request"/>
    <text class="legend-text" x="423" y="5">request data path</text>
    <line x1="625" y1="0" x2="680" y2="0" class="config"/>
    <text class="legend-text" x="693" y="5">control plane / config</text>
    <line x1="905" y1="0" x2="960" y2="0" class="response"/>
    <text class="legend-text" x="973" y="5">response theo đường ngược</text>
  </g>
</svg>
